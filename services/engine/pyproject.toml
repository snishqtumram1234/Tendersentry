[project]
name = "tendersentry-engine"
version = "0.1.0"
description = "TenderSentry engine: documents, extraction, rules, compliance, verification, reports (spec §4.1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.24,<2",
  "boto3>=1.35,<2",
  "jsonschema>=4.23,<5",
  "anthropic>=0.39,<1",
  "pytesseract>=0.3,<1",
  "pyzbar>=0.1,<1",
  "pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<0.28",
  "ruff>=0.7,<0.8",
  "mypy>=1.13,<2",
  "qrcode>=7.4,<8",  # test-only: generates real QR images to verify decode_qr_codes against
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
